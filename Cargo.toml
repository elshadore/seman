[package]
name = "seman"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "=4.6.4", features = ["derive"] }
daemonize = "0.5.0"
humantime = "2.4.0"
itertools = "0.15.0"
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
simplelog = "0.12"
time = "0.3"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "sync", "time"] }
